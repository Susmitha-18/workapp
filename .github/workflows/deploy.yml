name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - develop

jobs:

  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-1

  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: terraform

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend
        run: docker build -t susmitha18/workapp-frontend:latest ./frontend

      - name: Build Backend
        run: docker build -t susmitha18/workapp-backend:latest ./backend

      - name: Push Frontend
        run: docker push susmitha18/workapp-frontend:latest

      - name: Push Backend
        run: docker push susmitha18/workapp-backend:latest

  deploy-dev:
    name: Deploy DEV
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: DEV Deployment
        run: echo "Deploying to DEV"

approval:
  name: Manual Approval
  runs-on: ubuntu-latest
  needs: deploy-dev
  environment:
    name: production

  steps:
    - name: Approval Gate
      run: echo "Approved for Production Deployment"

  deploy-prod:
    name: Deploy PROD
    runs-on: ubuntu-latest
    needs: approval

    steps:
      - name: PROD Deployment
        run: echo "Deploying to PROD"