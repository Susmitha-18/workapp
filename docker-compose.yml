  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: terraform

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend Image
        run: docker build -t susmitha18/workapp-frontend:latest ./frontend

      - name: Build Backend Image
        run: docker build -t susmitha18/workapp-backend:latest ./backend

      - name: Push Frontend Image
        run: docker push susmitha18/workapp-frontend:latest

      - name: Push Backend Image
        run: docker push susmitha18/workapp-backend:latest